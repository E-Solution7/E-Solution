<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>আবেদন-সহায়তা | E-Solution</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="page" id="content">
<h1>আবেদন-সহায়তার অনুরোধ</h1>
<p class="warnbox">এটি নমুনা ফরম। নাম বা ফোন নম্বর কোথাও জমা হয় না; শুধু একটি ডেমো ট্র্যাকিং আইডি এই ব্রাউজারে সেভ হয়।</p>
<form id="applyForm" novalidate>
<label for="service">সেবা নির্বাচন</label><select id="service"></select>
<label for="name">আপনার নাম</label><input id="name" autocomplete="name" placeholder="পূর্ণ নাম"><p class="field-error" id="nameErr" role="alert"></p>
<label for="phone">মোবাইল নম্বর</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX"><p class="field-error" id="phoneErr" role="alert"></p>
<label for="note">কী সহায়তা প্রয়োজন?</label><textarea id="note" rows="4" placeholder="NID/পাসপোর্টের নম্বর এখানে লিখবেন না"></textarea><p class="field-error" id="noteErr" role="alert"></p>
<div class="actions"><button class="btn" type="submit">আবেদন জমা দিন</button><a class="btn outline" href="index.html">← হোমপেজ</a></div>
</form>
<div id="msg" class="toast" role="status" hidden style="margin-top:16px"></div>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/apply.js"></script>
</body>
</html>
