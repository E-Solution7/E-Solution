      const [adminPass, setAdminPass] = useState("");

          localStorage.setItem("esolution_apps", JSON.stringify(initial));

          trackingId: randomId,
          category: categoryName,
          serviceName: serviceTitle,
          applicantName: form.get("applicantName"),
          mobile: form.get("mobile"),
          district: form.get("district"),
          upazila: form.get("upazila"),
          details: form.get("details") || "সাধারণ অনলাইন আবেদন",
          status: "Pending",

        setLastTrackingId(randomId);
        e.target.reset();

          (a) => a.trackingId.toLowerCase() === q || a.mobile === q

                <button

                    </h2>

                      <span className="bg-amber-400 text-slate-950 font-bold px-3 py-1 rounded-full text-xs">
                        {trackedApp.status}
                      </span>
                    </div>
                    <p><strong>সেবার বিভাগ:</strong> {trackedApp.category} ({trackedApp.serviceName})</p>
                    <p><strong>আবেদনকারী:</strong> {trackedApp.applicantName} ({trackedApp.mobile})</p>
                    <p><strong>ঠিকানা ও বিবরণ:</strong> {trackedApp.upazila}, {trackedApp.district} — {trackedApp.details}</p>
                    <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs">
                      <strong>অফিসিয়াল নোট:</strong> {trackedApp.note}
                    </div>
                  </div>
                )}
              </div>
            </main>
          )}

          {/* ==================== VIEW 5: ADMIN DASHBOARD ==================== */}
          {activeView === "dashboard" && (
            <main className="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
              {!isAdmin ? (
                <div className="max-w-md mx-auto bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                  <h3 className="text-xl font-bold text-emerald-900">🔐 অ্যাডমিন / এজেন্ট লগইন</h3>
                  <div className="bg-emerald-50 p-3 rounded-xl text-xs">
                    ডেমো ফোন: <strong>01700000000</strong> | পাসওয়ার্ড: <strong>admin</strong>
                  </div>
                  <input value={adminPhone} onChange={(e) => setAdminPhone(e.target.value)} placeholder="মোবাইল নম্বর" className="w-full border rounded-xl px-3 py-2 text-sm" />
                  <input type="password" value={adminPass} onChange={(e) => setAdminPass(e.target.value)} placeholder="পাসওয়ার্ড" className="w-full border rounded-xl px-3 py-2 text-sm" />
                  <button
                    onClick={() => {
                      if (adminPhone === "01700000000" && adminPass === "admin") setIsAdmin(true);
                      else alert("ডেমো লগইন করতে ফোন: 01700000000 এবং পাসওয়ার্ড: admin দিন");
                    }}
                    className="w-full bg-emerald-700 text-white font-bold py-2.5 rounded-xl"
                  >
                    লগইন করুন
                  </button>
                </div>
              ) : (
                <div className="bg-white p-6 rounded-2xl border shadow-sm">
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="text-xl font-bold">📊 সকল আবেদনের নিয়ন্ত্রণ ড্যাশবোর্ড ({applications.length}টি)</h3>
                    <button onClick={() => setIsAdmin(false)} className="text-xs bg-rose-100 text-rose-700 font-bold px-3 py-1.5 rounded-lg">লগআউট</button>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr className="bg-slate-100 border-b">
                          <th className="p-3">ট্র্যাকিং আইডি</th>
                          <th className="p-3">বিভাগ ও সেবা</th>
                          <th className="p-3">আবেদনকারী</th>
                          <th className="p-3">স্ট্যাটাস পরিবর্তন</th>
                        </tr>
                      </thead>
                      <tbody>
                        {applications.map((app) => (
                          <tr key={app.trackingId} className="border-b">
                            <td className="p-3 font-bold text-emerald-800">{app.trackingId}</td>
                            <td className="p-3">{app.category} - {app.serviceName}</td>
                            <td className="p-3">{app.applicantName} ({app.mobile})</td>
                            <td className="p-3">
                              <select
                                value={app.status}
                                onChange={(e) => {
                                  const updated = applications.map((a) =>
                                    a.trackingId === app.trackingId ? { ...a, status: e.target.value } : a
                                  );
                                  saveApps(updated);
                                }}
                                className="border rounded px-2 py-1 font-bold"
                              >
                                <option value="Pending">Pending</option>
                                <option value="Processing">Processing</option>
                                <option value="Completed">Completed</option>
                              </select>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </main>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-6 px-4 text-center mt-12">
            © ২০২৬ E-Solution (সহজ সমাধান, সবার জন্য) | ৬টি মৌলিক সেবা ও ই-ভূমি সেবা প্ল্যাটফর্ম
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
