<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Solution | ডিজিটাল নাগরিক ও ভূমি সেবা বাতায়ন</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const VUMI_SERVICES = [
      { id: "mutation", title: "ই-নামজারি (মিউটেশন) আবেদন", fee: 1500, time: "২৮ দিন", icon: "📝", desc: "জমির মালিকানা পরিবর্তন ও নতুন খতিয়ান তৈরি।" },
      { id: "ldtax", title: "ভূমি উন্নয়ন কর (খাজনা) প্রদান", fee: 150, time: "২ দিন", icon: "💳", desc: "অনলাইনে খাজনা পরিশোধ ও দাখিলা সংগ্রহ।" },
      { id: "eporcha", title: "খতিয়ান ও পর্চা (CS/SA/RS)", fee: 200, time: "৫ দিন", icon: "📜", desc: "অনলাইন কপি বা সার্টিফাইড পর্চা উত্তোলন।" },
      { id: "mouzamap", title: "মৌজা ম্যাপ (নকশা) সংগ্রহ", fee: 700, time: "৭ দিন", icon: "🗺️", desc: "দাগ অনুযায়ী সরকারি মৌজা ম্যাপ সংগ্রহ।" },
      { id: "misccase", title: "মিস কেস ও খতিয়ান সংশোধন", fee: 1000, time: "৩০ দিন", icon: "⚖️", desc: "খতিয়ানে নামের বানান বা ভুল সংশোধনের আবেদন।" },
      { id: "deedcheck", title: "দলিল তল্লাশি ও সার্টিফাইড কপি", fee: 700, time: "১০ দিন", icon: "🔍", desc: "সাব-রেজিস্ট্রি অফিস থেকে দলিলের নকল উত্তোলন।" }
    ];

    const MOULIK_SERVICES = [
      { id: "food", title: "🌾 খাদ্য ও কৃষি সেবা", desc: "কৃষক কার্ড, সার-বীজ ভর্তুকি ও টিসিবি সহায়তা।" },
      { id: "textile", title: "👕 বস্ত্র ও কুটির শিল্প", desc: "তাঁত বোর্ড, বিসিক নিবন্ধন ও উদ্যোক্তা ঋণ।" },
      { id: "housing", title: "🏢 বাসস্থান ও আবাসন", desc: "গৃহায়ন ঋণ, প্ল্যান অনুমোদন ও হোল্ডিং ট্যাক্স।" },
      { id: "edu", title: "🎓 শিক্ষা ও দক্ষতা উন্নয়ন", desc: "ভর্তি, উপবৃত্তি, সনদ সংশোধন ও আইটি ট্রেনিং।" },
      { id: "health", title: "🩺 চিকিৎসা ও স্বাস্থ্য সেবা", desc: "ডাক্তার সিরিয়াল, অ্যাম্বুলেন্স ও ব্লাড ব্যাংক।" },
      { id: "legal", title: "⚖️ আইনি ও ডিজিটাল নাগরিক", desc: "এনআইডি, পাসপোর্ট, জন্ম নিবন্ধন ও অনলাইন জিডি।" }
    ];

    function App() {
      const [view, setView] = useState("home");
      const [selectedSrv, setSelectedSrv] = useState(VUMI_SERVICES[0].title);
      const [apps, setApps] = useState([]);
      const [lastId, setLastId] = useState("");
      const [trackQuery, setTrackQuery] = useState("");
      const [trackResult, setTrackResult] = useState(null);
      const [trackMsg, setTrackMsg] = useState("");

      // Calculator state
      const [len, setLen] = useState("");
      const [wid, setWid] = useState("");

      // Admin auth
      const [isAdmin, setIsAdmin] = useState(false);
      const [phone, setPhone] = useState("");
      const [pass, setPass] = useState("");

      useEffect(() => {
        const saved = localStorage.getItem("esolution_apps_v2");
        if (saved) {
          setApps(JSON.parse(saved));
        } else {
          const demo = [{
            trackingId: "ES-2026-1001",
            name: "মোঃ রফিকুল ইসলাম",
            mobile: "01711000000",
            service: "ই-নামজারি (মিউটেশন) আবেদন",
            status: "Processing",
            note: "ইউনিয়ন ভূমি অফিসে নথিপত্র যাচাই চলছে।"
          }];
          setApps(demo);
          localStorage.setItem("esolution_apps_v2", JSON.stringify(demo));
        }
      }, []);

      const saveApps = (list) => {
        setApps(list);
        localStorage.setItem("esolution_apps_v2", JSON.stringify(list));
      };

      const handleApply = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const id = `ES-2026-${Math.floor(1000 + Math.random() * 9000)}`;
        const newApp = {
          trackingId: id,
          name: fd.get("name"),
          mobile: fd.get("mobile"),
          service: selectedSrv,
          status: "Pending",
          note: "আবেদন সফলভাবে জমা হয়েছে। প্রতিনিধি দ্রুত যোগাযোগ করবেন।"
        };
        saveApps([newApp, ...apps]);
        setLastId(id);
        e.target.reset();
      };

      const handleSearch = (e) => {
        if (e) e.preventDefault();
        setTrackMsg("");
        const q = trackQuery.trim().toLowerCase();
        const found = apps.find(a => a.trackingId.toLowerCase() === q || a.mobile === q);
        if (found) setTrackResult(found);
        else {
          setTrackResult(null);
          setTrackMsg("কোনো আবেদন পাওয়া যায়নি! ডেমো দেখতে লিখুন: ES-2026-1001");
        }
      };

      const sq = (parseFloat(len) || 0) * (parseFloat(wid) || 0);
      const shotok = (sq / 435.6).toFixed(2);
      const katha = (sq / 720).toFixed(2);

      return (
        <div className="min-h-screen flex flex-col text-slate-800">
          {/* HEADER */}
          <header className="bg-white border-b sticky top-0 z-50 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
              <div onClick={() => setView("home")} className="cursor-pointer flex items-center gap-2">
                <div className="w-10 h-10 bg-emerald-700 text-white rounded-xl flex items-center justify-center font-black text-xl">E</div>
                <div>
                  <h1 className="font-extrabold text-lg leading-none">E-Solution</h1>
                  <p className="text-[11px] text-emerald-700 font-bold">সহজ সমাধান, সবার জন্য</p>
                </div>
              </div>
              <nav className="flex gap-2 text-xs md:text-sm font-bold">
                <button onClick={() => setView("home")} className={`px-3 py-2 rounded-lg ${view === "home" ? "bg-emerald-700 text-white" : "hover:bg-slate-100"}`}>হোম</button>
                <button onClick={() => setView("apply")} className={`px-3 py-2 rounded-lg ${view === "apply" ? "bg-emerald-700 text-white" : "hover:bg-slate-100"}`}>আবেদন</button>
                <button onClick={() => setView("track")} className={`px-3 py-2 rounded-lg ${view === "track" ? "bg-emerald-700 text-white" : "hover:bg-slate-100"}`}>ট্র্যাকিং</button>
                <button onClick={() => setView("admin")} className="bg-amber-400 px-3 py-2 rounded-lg text-slate-950">অ্যাডমিন</button>
              </nav>
            </div>
          </header>

          {/* MAIN CONTENT */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 py-8">
            {view === "home" && (
              <div className="space-y-10">
                {/* Hero */}
                <div className="bg-gradient-to-r from-emerald-900 to-teal-900 text-white p-8 rounded-3xl shadow-xl grid md:grid-cols-2 gap-6 items-center">
                  <div>
                    <span className="bg-amber-400 text-slate-950 text-xs font-black px-3 py-1 rounded-full">ডিজিটাল সেবা পোর্টাল</span>
                    <h2 className="text-3xl font-black mt-3">ভূমি ও মৌলিক নাগরিক সেবা এখন এক ক্লিকে</h2>
                    <p className="text-xs md:text-sm text-emerald-100 mt-2">ই-নামজারি, পর্চা, খাজনা এবং ৬টি মৌলিক সেবার জন্য ঘরে বসে আবেদন করুন।</p>
                  </div>
                  <div className="bg-white text-slate-800 p-5 rounded-2xl shadow">
                    <h3 className="font-bold text-sm mb-2 text-emerald-900">🛰️ দ্রুত আবেদন ট্র্যাকিং</h3>
                    <form onSubmit={(e) => { e.preventDefault(); handleSearch(); setView("track"); }} className="flex gap-2">
                      <input type="text" value={trackQuery} onChange={e => setTrackQuery(e.target.value)} placeholder="ট্র্যাকিং আইডি (ES-2026-1001)..." className="flex-1 border rounded-xl px-3 py-2 text-xs" required />
                      <button type="submit" className="bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl">খুঁজুন</button>
                    </form>
                  </div>
                </div>

                {/* Vumi Seba Cards */}
                <div>
                  <h3 className="text-xl font-extrabold text-emerald-950 mb-4">🏡 বিশেষ ভূমি সেবা (কার্ড নং ১)</h3>
                  <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {VUMI_SERVICES.map(s => (
                      <div key={s.id} className="bg-white p-5 rounded-2xl border shadow-sm flex flex-col justify-between">
                        <div>
                          <div className="text-3xl mb-2">{s.icon}</div>
                          <h4 className="font-bold text-slate-900">{s.title}</h4>
                          <p className="text-xs text-slate-500 mt-1 mb-3">{s.desc}</p>
                        </div>
                        <button onClick={() => { setSelectedSrv(s.title); setView("apply"); }} className="w-full bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold py-2 rounded-xl">আবেদন করুন →</button>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 6 Moulik Seba Cards */}
                <div>
                  <h3 className="text-xl font-extrabold text-slate-950 mb-4">🌟 মানুষের ৬টি মৌলিক সেবা (কার্ড নং ২ থেকে ৭)</h3>
                  <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {MOULIK_SERVICES.map(m => (
                      <div key={m.id} className="bg-white p-5 rounded-2xl border shadow-sm flex flex-col justify-between">
                        <div>
                          <h4 className="font-bold text-slate-900 text-base">{m.title}</h4>
                          <p className="text-xs text-slate-500 mt-1 mb-4">{m.desc}</p>
                        </div>
                        <button onClick={() => { setSelectedSrv(m.title); setView("apply"); }} className="w-full bg-slate-900 hover:bg-emerald-700 text-white text-xs font-bold py-2 rounded-xl transition">সেবা বিস্তারিত ও আবেদন →</button>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Calculator Box */}
                <div className="bg-white p-6 rounded-2xl border shadow-sm">
                  <h3 className="text-lg font-bold text-emerald-950 mb-2">📐 জমির পরিমাপ ক্যালকুলেটর (শতক ও কাঠা)</h3>
                  <div className="grid sm:grid-cols-2 gap-3 mb-4">
                    <input type="number" value={len} onChange={e => setLen(e.target.value)} placeholder="দৈর্ঘ্য (ফুট)" className="border rounded-xl px-3 py-2 text-xs" />
                    <input type="number" value={wid} onChange={e => setWid(e.target.value)} placeholder="প্রস্থ (ফুট)" className="border rounded-xl px-3 py-2 text-xs" />
                  </div>
                  <div className="bg-emerald-900 text-white p-4 rounded-xl grid grid-cols-3 text-center text-xs">
                    <div>বর্গফুট: <strong>{sq.toFixed(1)}</strong></div>
                    <div>শতক: <strong className="text-amber-300">{shotok}</strong></div>
                    <div>কাঠা: <strong className="text-emerald-300">{katha}</strong></div>
                  </div>
                </div>
              </div>
            )}

            {view === "apply" && (
              <div className="max-w-xl mx-auto bg-white p-6 rounded-2xl border shadow-sm">
                <h3 className="text-xl font-extrabold text-emerald-900 mb-2">📝 অনলাইন আবেদন ফরম</h3>
                {lastId && (
                  <div className="mb-4 bg-emerald-50 border p-3 rounded-xl text-center text-xs">
                    ✅ সফল! আপনার ট্র্যাকিং আইডি: <strong className="text-emerald-800 text-sm">{lastId}</strong>
                  </div>
                )}
                <form onSubmit={handleApply} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1">সেবার নাম:</label>
                    <input type="text" value={selectedSrv} readOnly className="w-full border rounded-xl px-3 py-2 bg-slate-100 font-bold" />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">আপনার নাম *</label>
                    <input name="name" required placeholder="পূর্ণ নাম" className="w-full border rounded-xl px-3 py-2" />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">মোবাইল নম্বর *</label>
                    <input name="mobile" required placeholder="017XXXXXXXX" className="w-full border rounded-xl px-3 py-2" />
                  </div>
                  <button type="submit" className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl">আবেদন জমা দিন</button>
                </form>
              </div>
            )}

            {view === "track" && (
              <div className="max-w-xl mx-auto bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                <h3 className="text-xl font-extrabold text-emerald-900">🛰️ লাইভ আবেদন ট্র্যাকিং</h3>
                <form onSubmit={handleSearch} className="flex gap-2">
                  <input type="text" value={trackQuery} onChange={e => setTrackQuery(e.target.value)} placeholder="ট্র্যাকিং আইডি বা মোবাইল নম্বর..." className="flex-1 border rounded-xl px-3 py-2 text-xs" />
                  <button type="submit" className="bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl">খুঁজুন</button>
                </form>
                {trackMsg && <p className="text-rose-600 text-xs font-bold">{trackMsg}</p>}
                {trackResult && (
                  <div className="bg-emerald-50 border p-4 rounded-xl text-xs space-y-2">
                    <div><strong>ট্র্যাকিং আইডি:</strong> {trackResult.trackingId}</div>
                    <div><strong>সেবা:</strong> {trackResult.service}</div>
                    <div><strong>আবেদনকারী:</strong> {trackResult.name} ({trackResult.mobile})</div>
                    <div><strong>বর্তমান স্ট্যাটাস:</strong> <span className="bg-amber-400 px-2 py-0.5 rounded font-bold">{trackResult.status}</span></div>
                    <div><strong>অফিসিয়াল নোট:</strong> {trackResult.note}</div>
                  </div>
                )}
              </div>
            )}

            {view === "admin" && (
              <div className="max-w-3xl mx-auto bg-white p-6 rounded-2xl border shadow-sm">
                {!isAdmin ? (
                  <div className="max-w-sm mx-auto space-y-3 text-xs">
                    <h3 className="font-bold text-sm text-emerald-900">অ্যাডমিন লগইন (ডেমো: 01700000000 / admin)</h3>
                    <input value={phone} onChange={e => setPhone(e.target.value)} placeholder="ফোন নম্বর" className="w-full border rounded-xl px-3 py-2" />
                    <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="পাসওয়ার্ড" className="w-full border rounded-xl px-3 py-2" />
                    <button onClick={() => { if(phone==="01700000000" && pass==="admin") setIsAdmin(true); else alert("ভুল তথ্য!"); }} className="w-full bg-emerald-700 text-white font-bold py-2.5 rounded-xl">লগইন</button>
                  </div>
                ) : (
                  <div className="space-y-4 text-xs">
                    <div className="flex justify-between items-center">
                      <h3 className="font-bold text-sm">সকল আবেদন নিয়ন্ত্রণ ({apps.length}টি)</h3>
                      <button onClick={() => setIsAdmin(false)} className="text-rose-600 font-bold">লগআউট</button>
                    </div>
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="bg-slate-100 border-b">
                          <th className="p-2">আইডি</th>
                          <th className="p-2">গ্রাহক</th>
                          <th className="p-2">সেবা</th>
                          <th className="p-2">স্ট্যাটাস</th>
                        </tr>
                      </thead>
                      <tbody>
                        {apps.map(a => (
                          <tr key={a.trackingId} className="border-b">
                            <td className="p-2 font-bold text-emerald-800">{a.trackingId}</td>
                            <td className="p-2">{a.name} ({a.mobile})</td>
                            <td className="p-2">{a.service}</td>
                            <td className="p-2">
                              <select value={a.status} onChange={e => {
                                const upd = apps.map(x => x.trackingId === a.trackingId ? {...x, status: e.target.value} : x);
                                saveApps(upd);
                              }} className="border rounded px-1 py-0.5 font-bold">
                                <option value="Pending">Pending</option>
                                <option value="Processing">Processing</option>
                                <option value="Completed">Completed</option>
                              </select>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}
          </main>

          <footer className="bg-slate-900 text-slate-400 text-xs py-6 text-center mt-12">
            © ২০২৬ E-Solution | সমস্ত অধিকার সংরক্ষিত।
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
